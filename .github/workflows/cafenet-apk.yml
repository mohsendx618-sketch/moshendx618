name: Build Hamyar CafeNet APK
on:
  push:
    paths:
      - 'cafenet-android/**'
      - '.github/workflows/cafenet-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cafenet-offline-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Validate packaged guide content
        run: python3 cafenet-android/scripts/validate_content.py
      - name: Test, lint and build APK
        run: gradle -p cafenet-android testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Verify package, signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp cafenet-android/app/build/outputs/apk/debug/app-debug.apk dist/Hamyar-CafeNet-1.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Hamyar-CafeNet-1.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Hamyar-CafeNet-1.1.apk > dist/apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/Hamyar-CafeNet-1.1.apk > dist/permissions.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          python3 - <<'PY'
          from pathlib import Path
          text = Path('dist/permissions.txt').read_text()
          for name in ['android.permission.INTERNET', 'android.permission.READ_CONTACTS',
                       'android.permission.READ_SMS', 'android.permission.READ_EXTERNAL_STORAGE',
                       'android.permission.WRITE_EXTERNAL_STORAGE']:
              assert name not in text, 'Unexpected permission: ' + name
          print('No network, SMS, contacts or shared storage permissions')
          PY
          cd dist
          sha256sum Hamyar-CafeNet-1.1.apk apksigner.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hamyar-CafeNet-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test offline on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 cafenet-android/scripts/smoke.py
      - name: Save test and emulator reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hamyar-CafeNet-Test-Reports
          path: |
            cafenet-android/app/build/reports/
            cafenet-android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
