name: Build Tarhplus APK
on:
  push:
    paths:
      - 'tarhplus-android/**'
      - '.github/workflows/tarhplus-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tarhplus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Test, lint and build installable APK
        run: gradle -p tarhplus-android testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Verify APK and package download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp tarhplus-android/app/build/outputs/apk/debug/app-debug.apk dist/Tarhplus-Abadeh-1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Tarhplus-Abadeh-1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Tarhplus-Abadeh-1.0.apk > dist/apk-info.txt
          cd dist
          sha256sum Tarhplus-Abadeh-1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Tarhplus-Abadeh-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Install and open on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tarhplus-android/scripts/smoke.sh
      - name: Save test and emulator reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Tarhplus-Test-Reports
          path: |
            tarhplus-android/app/build/reports/
            tarhplus-android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
